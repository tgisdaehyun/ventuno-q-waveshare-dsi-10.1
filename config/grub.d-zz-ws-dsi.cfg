# /etc/default/grub.d/zz-ws-dsi.cfg  (run update-grub afterwards; remove the file + update-grub to undo)
#
# The panel is 800x1280 portrait. Telling the kernel its orientation rotates the text console
# (fbcon), the plymouth splash and the GNOME desktop together. Use right_side_up or left_side_up
# depending on which way round the panel is mounted.
GRUB_CMDLINE_LINUX="${GRUB_CMDLINE_LINUX} video=DSI-1:panel_orientation=left_side_up"

# ws_vrefresh : default refresh rate (60 Hz shows slowly moving bands on this board, see README)
# ws_sweep=1  : also offer 48..72 Hz, selectable in Settings > Displays
GRUB_CMDLINE_LINUX="${GRUB_CMDLINE_LINUX} panel_jadard_jd9365da_h3.ws_vrefresh=68 panel_jadard_jd9365da_h3.ws_sweep=1"
